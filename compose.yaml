services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: npms
      POSTGRES_USER: npms
      POSTGRES_PASSWORD: npms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U npms -d npms"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "postgres://npms:npms@postgres:5432/npms?sslmode=disable"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

